kind: "Mixin"
title: "Footer config"
form:
  - type: "TextLine"
    name: "footerCopyright"
    label: "Copyright Text"
    helpText: "Text after the year — e.g. 'My Store. All rights reserved.'"
    occurrences:
      min: 0
      max: 1
  - type: "TextLine"
    name: "footerColumnHeading"
    label: "Custom Column Heading"
    helpText: "Heading for the custom links column in the footer"
    occurrences:
      min: 0
      max: 1
  - type: "ItemSet"
    name: "footerLinks"
    label: "Custom Column Links"
    occurrences:
      min: 0
      max: 0
    items:
      - type: "TextLine"
        name: "label"
        label: "Label"
        occurrences:
          min: 1
          max: 1
      - type: "TextLine"
        name: "url"
        label: "URL"
        occurrences:
          min: 1
          max: 1